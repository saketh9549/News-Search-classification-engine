[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "news-search-engine"
version = "0.1.0"
description = "Polite news crawler and multi-field BM25 search engine"
readme = "TODO.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "defusedxml>=0.7",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "nltk>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
news-engine = "src.pipeline:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
